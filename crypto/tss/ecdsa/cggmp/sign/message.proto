syntax = "proto3";

package getamis.alice.crypto.tss.ecdsa.cggmp.sign;

option go_package = "github.com/getamis/alice/crypto/tss/ecdsa/cggmp/sign";

import "github.com/getamis/alice/crypto/ecpointgrouplaw/point.proto";
import "github.com/getamis/alice/crypto/zkproof/paillier/message.proto";

enum Type {
    Round1 = 0;
    Round2 = 1;
    Round3 = 2;
    Round4 = 3;

    Err1 = 4;
    Err2 = 5;
}

message Message {
    Type type = 1;
    string id = 2;
    oneof body {
        Round1Msg round1 = 4;
        Round2Msg round2 = 5;
        Round3Msg round3 = 6;
        Round4Msg round4 = 7;

        // Error message
        Err1Msg err1 = 8;
        Err2Msg err2 = 9;        
    }
}

message Round1Msg {
    bytes kCiphertext = 1;
    bytes gammaCiphertext = 2;
    getamis.alice.crypto.zkproof.paillier.EncryptRangeMessage psi = 3; 
}

message Round2Msg {
    bytes D = 1;
    bytes F = 2;
    bytes Dhat = 3;
    bytes Fhat = 4;
    getamis.alice.crypto.zkproof.paillier.PaillierAffAndGroupRangeMessage psi = 5;
    getamis.alice.crypto.zkproof.paillier.PaillierAffAndGroupRangeMessage psihat = 6;
    getamis.alice.crypto.zkproof.paillier.LogStarMessage psipai = 7;
    ecpointgrouplaw.EcPointMessage Gamma = 8;
}

message Round3Msg {
    string delta = 1;
    ecpointgrouplaw.EcPointMessage bigDelta = 2;
    getamis.alice.crypto.zkproof.paillier.LogStarMessage psidoublepai = 3;
}

message Round4Msg {
    bytes sigmai = 1;
}

message Err1Msg {
    bytes kgammaCiphertext = 1;
    getamis.alice.crypto.zkproof.paillier.MulMessage mulProof = 2;
    map<string, Err1PeerMsg> peers = 3;
}

message Err1PeerMsg {
    getamis.alice.crypto.zkproof.paillier.DecryMessage decModQ = 1;
    // Untranslated MtA product C0; DecModQ uses PublicX(δ)=(δ+Σc·N) mod q.
    bytes productCiphertext = 2;
    // D_{peer→prover} (under prover Paillier) used in the product.
    bytes d = 3;
    // F_{prover→peer} (under prover Paillier) used in the product.
    bytes f = 4;
}

message Err2Msg {
    bytes kMulBkShareCiphertext = 1;
    map<string, Err2PeerMsg> peers = 2;
    // χ_i for Scheme A' (PublicX(χ) and σ−r·χ).
    bytes chi = 3;
}

message Err2PeerMsg {
    getamis.alice.crypto.zkproof.paillier.MulStarMessage mulStarProof = 1;
    // DecModQ on untranslated C_inner vs PublicX(χ).
    getamis.alice.crypto.zkproof.paillier.DecryMessage decModQ = 2;
    bytes productCiphertext = 3;
    bytes d = 4;
    bytes f = 5;
    // DecModQ on K^m vs (σ − r·χ) mod q.
    getamis.alice.crypto.zkproof.paillier.DecryMessage decModQKm = 6;
}
